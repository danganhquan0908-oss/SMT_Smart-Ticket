services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: busgo_smartticket
      POSTGRES_USER: smartticket
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartticket -d busgo_smartticket"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    build: .
    ports: ["127.0.0.1:5088:8080"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres;Database=busgo_smartticket;Username=smartticket;Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379
      Tickets__SigningKey: ${TICKET_SIGNING_KEY:?Set TICKET_SIGNING_KEY}
      Dispatch__SigningKey: ${DISPATCH_SIGNING_KEY:?Set DISPATCH_SIGNING_KEY}
      Admin__Email: ${ADMIN_EMAIL:?Set ADMIN_EMAIL}
      Admin__Password: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
    volumes:
      - private-files:/app/App_Data
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
volumes:
  database:
  private-files:
